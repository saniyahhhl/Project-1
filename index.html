<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Company Network Topology — Project 1</title>
  <style>
    :root{--ink:#fff;--bg:#000;--brand:#1f6feb;--ring:#2a2a2a}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);
      font:16px/1.6 -apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Inter,system-ui}
    .wrap{width:min(960px,92vw);margin:40px auto}
    h1{margin:0 0 8px;font-size:clamp(28px,5vw,40px)}
    p{margin:0 0 14px}
    .card{border:1px solid var(--ring);border-radius:14px;padding:18px;background:#0b0b0b}
    .media{display:block;width:100%;height:auto;border-radius:12px;border:1px solid var(--ring)}
    .btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
    .btn{display:inline-flex;align-items:center;gap:.5rem;padding:10px 16px;border-radius:999px;
      text-decoration:none;font-weight:700;background:var(--brand);color:#fff;border:1px solid var(--brand)}
    .btn.ghost{background:transparent;border:1px solid var(--ring)}
    footer{margin-top:28px;color:#bbb}
    a{color:var(--brand)}
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Company Network Topology (Project 1)</h1>
    <p>Built in Cisco Packet Tracer — routers, switches, and end devices. See README for details.</p>

    <div class="card">
      <img class="media" src="Top ss 1.png" alt="Network Topology screenshot">
      <div class="btns">
        <a class="btn" href="https://raw.githubusercontent.com/saniyahhhl/Project-1/main/Network%20Topology%20Kinder%20Morgan-4%20(1).pkt" target="_blank" rel="noopener">Download .pkt</a>
        
        <a class="btn ghost" href="https://github.com/saniyahhhl/Project-1" target="_blank" rel="noopener">View on GitHub</a>
      </div>
    </div>

    <footer>© Saniyah Wheeler — Project 1</footer>
  </div>
</body>
</html>
